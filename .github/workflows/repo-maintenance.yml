name: Repository Maintenance

on:
  schedule:
    - cron: '0 4 * * 0'  # Weekly on Sunday at 4 AM JST
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 30
          keep_minimum_runs: 10

      - name: Clean up old branches
        run: |
          # Delete merged branches older than 30 days
          git fetch --prune
          git for-each-ref --format '%(refname:short) %(committerdate)' refs/remotes/origin |
          awk '$2 <= "'$(date -d '30 days ago' -I)'"' |
          grep -v 'origin/main' |
          cut -d' ' -f1 |
          sed 's|origin/||' |
          xargs -I {} git push origin --delete {} || true
